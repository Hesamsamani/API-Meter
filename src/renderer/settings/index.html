<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'">
  <title>API-Meter Settings</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="settings-shell">
    <header class="titlebar">
      <div class="titlebar-brand">
        <span class="dot"></span>
        Settings
      </div>
      <div class="titlebar-actions">
        <button class="titlebar-btn close" id="btn-close" title="Close">✕</button>
      </div>
    </header>

    <form class="settings-body" id="settings-form">
      <section class="settings-section">
        <h2>General</h2>
        <label class="field-check">
          <input type="checkbox" id="launch-at-startup">
          <span>Launch at Windows startup</span>
        </label>
        <p class="field-hint">Starts minimized to the system tray when you sign in to Windows.</p>
      </section>

      <section class="settings-section">
        <h2>Telemetry</h2>
        <label class="field-row">
          <span>Refresh interval (minutes)</span>
          <input type="number" id="refresh-interval" min="1" max="60" step="1">
        </label>
        <label class="field-check">
          <input type="checkbox" id="auto-refresh">
          <span>Auto-refresh enabled</span>
        </label>
      </section>

      <section class="settings-section">
        <h2>Alerts</h2>
        <label class="field-check">
          <input type="checkbox" id="alerts-enabled">
          <span>Desktop notifications</span>
        </label>
        <label class="field-row">
          <span>Warn threshold (%)</span>
          <input type="number" id="warn-threshold" min="1" max="99" step="1">
        </label>
        <label class="field-row">
          <span>Danger threshold (%)</span>
          <input type="number" id="danger-threshold" min="1" max="100" step="1">
        </label>
      </section>

      <section class="settings-section">
        <h2>Floating Widget</h2>
        <label class="field-row">
          <span>Display mode</span>
          <select id="widget-display-mode">
            <option value="single">Single provider</option>
            <option value="grid">Grid (all pinned)</option>
            <option value="compact">Compact list</option>
          </select>
        </label>
        <label class="field-row">
          <span>Size</span>
          <select id="widget-size">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </label>
        <label class="field-row">
          <span>Theme</span>
          <select id="widget-theme">
            <option value="dark">Dark</option>
            <option value="midnight">Midnight</option>
            <option value="glass">Glass</option>
            <option value="light">Light</option>
            <option value="minimal">Minimal</option>
          </select>
        </label>
        <label class="field-row">
          <span>Opacity</span>
          <input type="range" id="widget-opacity" min="50" max="100" step="5">
        </label>
        <label class="field-check">
          <input type="checkbox" id="widget-auto-rotate">
          <span>Auto-rotate (single mode, 10s)</span>
        </label>
        <p class="field-hint">Pin providers to control what appears in grid/list mode. Use −/+ and ◐ on the widget for quick resize and theme. Toggle widget from tray.</p>
        <div class="widget-pin-grid" id="widget-pin-grid"></div>
      </section>

      <section class="settings-section">
        <h2>Providers</h2>
        <div class="provider-toggles" id="provider-toggles"></div>
      </section>

      <div class="settings-actions">
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
