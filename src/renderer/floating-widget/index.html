<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'">
  <title>API-Meter Widget</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; }
    body::before { display: none !important; }
  </style>
</head>
<body>
  <div class="widget" id="widget-root" data-theme="dark" data-size="medium" data-mode="single">
    <header class="widget-header">
      <span class="widget-brand">API-Meter</span>
      <div class="widget-toolbar">
        <button class="widget-btn" id="widget-smaller" type="button" title="Smaller">−</button>
        <button class="widget-btn" id="widget-larger" type="button" title="Larger">+</button>
        <button class="widget-btn" id="widget-theme" type="button" title="Cycle theme">◐</button>
        <button class="widget-btn widget-close" id="widget-close" type="button" title="Close">✕</button>
      </div>
    </header>
    <div class="widget-body" id="widget-body"></div>
    <footer class="widget-footer" id="widget-footer">
      <button class="widget-nav" id="widget-prev" type="button" aria-label="Previous">‹</button>
      <div class="widget-dots" id="widget-dots"></div>
      <button class="widget-nav" id="widget-next" type="button" aria-label="Next">›</button>
    </footer>
    <div class="widget-click-badge" id="widget-click-badge" hidden title="Click-through enabled — right-click to interact">◌</div>
  </div>
  <nav class="widget-ctx" id="widget-ctx" hidden role="menu" aria-label="Widget menu">
    <button type="button" class="widget-ctx__item" id="ctx-click-through" role="menuitem">Enable click-through</button>
    <button type="button" class="widget-ctx__item" id="ctx-settings" role="menuitem">Open settings</button>
    <button type="button" class="widget-ctx__item" id="ctx-close" role="menuitem">Close widget</button>
  </nav>
  <script type="module" src="widget.js"></script>
</body>
</html>
