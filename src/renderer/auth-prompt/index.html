<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'">
  <title>Sign In</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    .auth-shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px 22px;
      gap: 14px;
    }
    .auth-shell h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .auth-shell p {
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }
    .auth-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.45;
    }
    .auth-status.waiting::before {
      content: '';
      flex-shrink: 0;
      margin-top: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .auth-status.ok::before {
      content: '';
      flex-shrink: 0;
      margin-top: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .auth-status.error::before {
      content: '';
      flex-shrink: 0;
      margin-top: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .auth-manual label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .auth-manual input,
    .auth-manual textarea {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 10px 12px;
    }
    .auth-manual input {
      margin-bottom: 10px;
    }
    .auth-manual textarea {
      min-height: 64px;
      resize: vertical;
    }
    .auth-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .auth-actions button {
      flex: 1;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .auth-actions button.primary {
      border-color: rgba(34, 197, 94, 0.35);
      background: rgba(34, 197, 94, 0.12);
    }
    .auth-actions button:hover { border-color: rgba(255, 255, 255, 0.18); }
  </style>
</head>
<body>
  <div class="auth-shell">
    <h1 id="auth-title">Sign In</h1>
    <p id="auth-desc">Use the API-Meter browser window to sign in. Your session is detected automatically when you finish.</p>
    <div class="auth-status waiting" id="auth-status">Waiting for in-app sign-in…</div>
    <div class="auth-manual">
      <label for="auth-cookie-name">Cookie name (optional fallback)</label>
      <input id="auth-cookie-name" type="text" placeholder="e.g. sessionKey, __Secure-1PSID" autocomplete="off">
      <label for="auth-manual-value">Session token (manual fallback)</label>
      <textarea id="auth-manual-value" placeholder="Only if in-app sign-in fails — paste cookie value here"></textarea>
    </div>
    <div class="auth-actions">
      <button type="button" id="auth-cancel">Cancel</button>
      <button type="button" id="auth-retry" class="primary">Check session</button>
      <button type="button" id="auth-save">Save token</button>
    </div>
  </div>
  <script type="module" src="auth-prompt.js"></script>
</body>
</html>
